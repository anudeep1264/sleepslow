<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Hypnotic Pacemaker · 5 Minute Sleep</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{width:100%;height:100%;background:#000;color:#4a4a4a;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;
    overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-font-smoothing:antialiased;font-weight:300}
  #stage{position:fixed;inset:0;background:#000}

  /* Landing */
  #landing{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0 32px;transition:opacity 1.4s ease;z-index:10}
  #landing.hidden{opacity:0;pointer-events:none}
  .brand{position:absolute;top:9vh;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.55em;
    text-transform:uppercase;color:#3a3a3a;font-weight:300}
  .brand b{color:#6a6a6a;font-weight:400}
  #enterBtn{position:relative;width:240px;height:240px;border-radius:50%;border:1px solid rgba(120,130,140,.16);
    background:radial-gradient(circle at 50% 50%,
      rgba(26,35,50,.65) 0%,
      rgba(44,53,49,.4) 45%,
      rgba(20,24,28,.15) 75%,
      rgba(0,0,0,0) 90%);
    color:#7a7a7a;font-size:10px;letter-spacing:.5em;font-weight:300;cursor:pointer;outline:none;
    box-shadow:0 0 80px 10px rgba(26,35,50,.35), inset 0 0 60px rgba(44,53,49,.22);
    animation:landPulse 7s ease-in-out infinite;transition:transform .8s ease,opacity 1s ease}
  #enterBtn:active{transform:scale(.97)}
  @keyframes landPulse{
    0%,100%{box-shadow:0 0 80px 10px rgba(26,35,50,.3), inset 0 0 60px rgba(44,53,49,.2);transform:scale(1)}
    50%{box-shadow:0 0 130px 20px rgba(26,35,50,.5), inset 0 0 80px rgba(44,53,49,.3);transform:scale(1.03)}
  }
  .disclaimer{position:absolute;bottom:7vh;left:24px;right:24px;text-align:center;font-size:9.5px;line-height:1.85;
    color:#2e2e2e;letter-spacing:.12em;max-width:340px;margin:0 auto}

  /* Session */
  #session{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity 2.4s ease;z-index:5}
  #session.on{opacity:1;pointer-events:auto}

  canvas#viz{position:absolute;inset:0;width:100%;height:100%;display:block}

  .phase-text{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;
    font-size:10.5px;letter-spacing:.6em;text-transform:uppercase;color:#555;font-weight:300;
    pointer-events:none;mix-blend-mode:screen;opacity:0;transition:opacity 2s ease;
    text-shadow:0 0 24px rgba(0,0,0,.95)}
  .phase-text.show{opacity:.78}
  .phase-text .label{display:block;margin-top:34vmin;font-size:10px;color:#555}
  .phase-text .sub{display:block;margin-top:8px;font-size:8.5px;color:#333;letter-spacing:.4em}

  .timer{position:absolute;bottom:max(70px,calc(env(safe-area-inset-bottom) + 70px));left:0;right:0;text-align:center;
    font-size:9.5px;letter-spacing:.5em;color:#333;font-variant-numeric:tabular-nums;font-weight:300}

  #stopBtn{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    background:transparent;border:1px solid rgba(85,85,85,.16);color:#444;
    padding:9px 22px;border-radius:999px;font-size:9px;letter-spacing:.45em;text-transform:uppercase;
    cursor:pointer;transition:all .4s ease;font-weight:300}
  #stopBtn:active{background:rgba(255,255,255,.02);color:#666}

  #fadeOut{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;
    transition:opacity 5s ease;z-index:20}
  #fadeOut.on{opacity:1}
</style>
</head>
<body>
<div id="stage">
  <div id="landing">
    <div class="brand">Hypnotic · <b>Pacemaker</b></div>
    <button id="enterBtn">BEGIN · 5 MIN</button>
    <p class="disclaimer">
      One minute of paced breathing, then four minutes of 8D delta entrainment.
      Use headphones. For relaxation only — not a medical device.
    </p>
  </div>

  <div id="session">
    <canvas id="viz"></canvas>
    <div class="phase-text" id="phase">
      <span class="label" id="phaseLbl">Breathe In</span>
      <span class="sub" id="phaseSub">4 · 2 · 4</span>
    </div>
    <div class="timer" id="timer">5:00</div>
    <button id="stopBtn">Stop</button>
  </div>

  <div id="fadeOut"></div>
</div>

<script>
(() => {
  const landing = document.getElementById('landing');
  const session = document.getElementById('session');
  const enterBtn = document.getElementById('enterBtn');
  const stopBtn = document.getElementById('stopBtn');
  const phaseEl = document.getElementById('phase');
  const phaseLbl = document.getElementById('phaseLbl');
  const phaseSub = document.getElementById('phaseSub');
  const timerEl = document.getElementById('timer');
  const fade = document.getElementById('fadeOut');
  const canvas = document.getElementById('viz');
  const ctx = canvas.getContext('2d');

  const SESSION_MS = 5*60*1000;
  const BREATH_MS  = 1*60*1000;     // Phase 1 length
  // 4s inhale, 2s hold, 4s exhale, 2s hold (total 12s? spec says 4/2/4 - we'll do 4-2-4-2 loop = 12s, hold-bot to keep symmetry hidden)
  // Spec: 4 inhale, 2 hold, 4 exhale. Loop = 10s.
  const CYCLE_MS = 10000;
  const PHASES = [
    {name:'Breathe In', sub:'4s', dur:4000, kind:'in'},
    {name:'Hold',       sub:'2s', dur:2000, kind:'hold'},
    {name:'Breathe Out',sub:'4s', dur:4000, kind:'out'},
  ];

  // Audio nodes
  let audioCtx, masterGain, oscL, oscR, gL, gR, noiseSrc, noiseGain,
      droneGain, panner, lfo, lfoGain, droneOscs = [];
  let sessionStart = 0, masterTimer = null, phaseTimer = null, tickTimer = null,
      liftTimer = null, droneTimer = null;
  let running = false, ended = false;

  // ---------- Canvas ----------
  let W=0,H=0,DPR=1;
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);

  let rafId = null;
  let t0 = 0;
  function draw(now){
    if(!running||ended) return;
    const t = (now - t0)/1000; // seconds since session start
    const elapsed = now - sessionStart;
    ctx.clearRect(0,0,W,H);

    const cx = W/2, cy = H/2;
    const baseR = Math.min(W,H)*0.22;

    // Smooth transition factor 0..1 between phase 1 (aura) and phase 2 (ripples)
    // Transition window 58s..62s
    const trans = Math.max(0, Math.min(1, (elapsed - 58000)/4000));

    // ------- Phase 1: Breathing aura -------
    if(trans < 1){
      // breath progress through current cycle
      const cyc = (elapsed % CYCLE_MS)/1000;
      let scale = 0.78;
      if(cyc < 4){ // inhale ease in/out
        const p = cyc/4;
        const e = 0.5 - 0.5*Math.cos(p*Math.PI);
        scale = 0.78 + 0.42*e;
      } else if(cyc < 6){ // hold top
        scale = 1.20;
      } else { // exhale
        const p = (cyc-6)/4;
        const e = 0.5 - 0.5*Math.cos(p*Math.PI);
        scale = 1.20 - 0.42*e;
      }
      const r = baseR * scale;

      const a1 = (1-trans);
      // outer glow
      const g1 = ctx.createRadialGradient(cx,cy,r*0.2, cx,cy, r*2.4);
      g1.addColorStop(0, `rgba(44,53,49,${0.55*a1})`);
      g1.addColorStop(0.35, `rgba(26,35,50,${0.35*a1})`);
      g1.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g1;
      ctx.beginPath(); ctx.arc(cx,cy,r*2.4,0,Math.PI*2); ctx.fill();

      // inner orb
      const g2 = ctx.createRadialGradient(cx- r*0.15, cy- r*0.18, r*0.1, cx,cy, r);
      g2.addColorStop(0, `rgba(70,86,102,${0.85*a1})`);
      g2.addColorStop(0.4, `rgba(44,53,49,${0.6*a1})`);
      g2.addColorStop(1, `rgba(12,16,22,${0.05*a1})`);
      ctx.fillStyle = g2;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();

      // ring stroke
      ctx.lineWidth = 1.1;
      ctx.strokeStyle = `rgba(120,140,160,${0.12*a1})`;
      ctx.beginPath(); ctx.arc(cx,cy,r*1.06,0,Math.PI*2); ctx.stroke();
    }

    // ------- Phase 2: Concentric expanding ripples -------
    if(trans > 0){
      const a2 = trans;
      const ringCount = 6;
      const period = 6.0; // seconds for a ring to travel out
      const maxR = Math.min(W,H)*0.55;
      for(let i=0;i<ringCount;i++){
        const phase = ((t/period) + i/ringCount) % 1;
        const r = baseR*0.35 + phase * (maxR - baseR*0.35);
        // fade in then out
        const env = Math.sin(phase*Math.PI); // 0..1..0
        const alpha = 0.22 * env * a2;
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = `rgba(120,140,160,${alpha})`;
        ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();

        // soft inner fill on innermost ring
        if(i===0){
          const g = ctx.createRadialGradient(cx,cy,0, cx,cy, r);
          g.addColorStop(0, `rgba(44,53,49,${0.35*a2*env})`);
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
        }
      }

      // central anchor dot — slowly drifts horizontally as a "pendulum" anchor
      const swing = Math.sin(t * (2*Math.PI*0.15)) * Math.min(W,H)*0.04;
      const cr = baseR*0.18;
      const gC = ctx.createRadialGradient(cx+swing,cy, 0, cx+swing,cy, cr);
      gC.addColorStop(0, `rgba(90,110,130,${0.85*a2})`);
      gC.addColorStop(0.5, `rgba(44,53,49,${0.5*a2})`);
      gC.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gC;
      ctx.beginPath(); ctx.arc(cx+swing,cy,cr,0,Math.PI*2); ctx.fill();
    }

    rafId = requestAnimationFrame(draw);
  }

  // ---------- Audio ----------
  function buildAudio(){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0;
    masterGain.connect(audioCtx.destination);

    // Binaural 100/104 -> 4Hz delta
    const merger = audioCtx.createChannelMerger(2);
    oscL = audioCtx.createOscillator(); oscL.type='sine'; oscL.frequency.value=100;
    oscR = audioCtx.createOscillator(); oscR.type='sine'; oscR.frequency.value=104;
    gL = audioCtx.createGain(); gL.gain.value=0.11;
    gR = audioCtx.createGain(); gR.gain.value=0.11;
    oscL.connect(gL).connect(merger,0,0);
    oscR.connect(gR).connect(merger,0,1);
    merger.connect(masterGain);
    oscL.start(); oscR.start();

    // Brown noise floor
    const sr = audioCtx.sampleRate;
    const buf = audioCtx.createBuffer(1, sr*4, sr);
    const d = buf.getChannelData(0);
    let last = 0;
    for(let i=0;i<d.length;i++){
      const w = Math.random()*2-1;
      last = (last + 0.02*w)/1.02;
      d[i] = last*3.5;
    }
    noiseSrc = audioCtx.createBufferSource();
    noiseSrc.buffer = buf; noiseSrc.loop = true;
    const lp = audioCtx.createBiquadFilter();
    lp.type='lowpass'; lp.frequency.value=320;
    noiseGain = audioCtx.createGain(); noiseGain.gain.value=0.10;
    noiseSrc.connect(lp).connect(noiseGain).connect(masterGain);
    noiseSrc.start();

    // 8D drone chain (silent until phase 2)
    panner = audioCtx.createStereoPanner();
    panner.pan.value = 0;
    droneGain = audioCtx.createGain(); droneGain.gain.value = 0.0;
    const droneFilter = audioCtx.createBiquadFilter();
    droneFilter.type='lowpass'; droneFilter.frequency.value=950;

    // crystal singing bowl: stacked sines
    const freqs = [196, 294, 392.4, 587];
    freqs.forEach((f,i)=>{
      const o = audioCtx.createOscillator();
      o.type = 'sine';
      o.frequency.value = f;
      const g = audioCtx.createGain();
      g.gain.value = 0.12 / (i+1);
      o.connect(g).connect(droneFilter);
      o.start();
      droneOscs.push(o);
    });
    droneFilter.connect(droneGain).connect(panner).connect(masterGain);

    // 8D LFO: 0.15Hz pan sweep
    lfo = audioCtx.createOscillator();
    lfo.type='sine';
    lfo.frequency.value = 0.15;
    lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 0.95;
    lfo.connect(lfoGain).connect(panner.pan);
    lfo.start();

    // master fade in
    const now = audioCtx.currentTime;
    masterGain.gain.setValueAtTime(0, now);
    masterGain.gain.linearRampToValueAtTime(0.9, now+5);
  }

  function introduceDrone(){
    if(!audioCtx || !droneGain) return;
    const now = audioCtx.currentTime;
    droneGain.gain.cancelScheduledValues(now);
    droneGain.gain.setValueAtTime(droneGain.gain.value, now);
    droneGain.gain.linearRampToValueAtTime(0.35, now + 12);
  }

  function fadeAudioOut(seconds){
    if(!audioCtx) return;
    const now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setValueAtTime(masterGain.gain.value, now);
    masterGain.gain.linearRampToValueAtTime(0.0001, now+seconds);
  }

  function killAudio(){
    if(!audioCtx) return;
    try{
      fadeAudioOut(0.4);
      setTimeout(()=>{ try{audioCtx.close()}catch(e){} audioCtx=null; }, 600);
    }catch(e){}
  }

  // ---------- Phase loop ----------
  function runPhase(i){
    const p = PHASES[i];
    phaseLbl.textContent = p.name;
    phaseSub.textContent = p.sub;
    phaseTimer = setTimeout(()=>runPhase((i+1)%PHASES.length), p.dur);
  }

  function fmt(ms){
    const s = Math.max(0, Math.ceil(ms/1000));
    const m = Math.floor(s/60), r = s%60;
    return m+':' + String(r).padStart(2,'0');
  }

  function tick(){
    const elapsed = performance.now() - sessionStart;
    const left = SESSION_MS - elapsed;
    timerEl.textContent = fmt(left);
    if(left<=0){ endSession(); return; }
    tickTimer = setTimeout(tick, 250);
  }

  function startSession(){
    if(running) return;
    running = true; ended = false;
    landing.classList.add('hidden');
    setTimeout(()=>{
      session.classList.add('on');
      phaseEl.classList.add('show');
    }, 400);
    buildAudio();
    sessionStart = performance.now();
    t0 = sessionStart;
    timerEl.textContent = '5:00';
    resize();
    runPhase(0);
    tick();
    rafId = requestAnimationFrame(draw);

    // At 1:00, fade out breathing text and bring in the drone
    droneTimer = setTimeout(()=>{
      phaseEl.classList.remove('show');
      introduceDrone();
    }, BREATH_MS);

    masterTimer = setTimeout(endSession, SESSION_MS);
  }

  function endSession(){
    if(ended) return;
    ended = true;
    clearTimeout(masterTimer); clearTimeout(phaseTimer); clearTimeout(tickTimer); clearTimeout(droneTimer);
    fadeAudioOut(5);
    fade.classList.add('on');
    setTimeout(()=>{
      try{audioCtx&&audioCtx.close()}catch(e){} audioCtx=null;
      cancelAnimationFrame(rafId);
    }, 5200);
  }

  function stopSession(){
    clearTimeout(masterTimer); clearTimeout(phaseTimer); clearTimeout(tickTimer); clearTimeout(droneTimer);
    clearTimeout(liftTimer); liftTimer=null;
    cancelAnimationFrame(rafId);
    killAudio();
    session.classList.remove('on');
    phaseEl.classList.remove('show');
    fade.classList.remove('on');
    ctx.clearRect(0,0,W,H);
    running = false; ended = false;
    setTimeout(()=>{ landing.classList.remove('hidden'); }, 600);
  }

  enterBtn.addEventListener('click', startSession);
  stopBtn.addEventListener('click', (e)=>{ e.stopPropagation(); stopSession(); });

  // Touch-hold safety
  function onTouchStart(){
    if(!running||ended) return;
    if(liftTimer){ clearTimeout(liftTimer); liftTimer=null; }
    if(fade.classList.contains('on')){
      fade.classList.remove('on');
      if(audioCtx){
        const now = audioCtx.currentTime;
        masterGain.gain.cancelScheduledValues(now);
        masterGain.gain.setValueAtTime(masterGain.gain.value, now);
        masterGain.gain.linearRampToValueAtTime(0.9, now+2);
      }
    }
  }
  function onTouchEnd(){
    if(!running||ended) return;
    if(liftTimer) clearTimeout(liftTimer);
    liftTimer = setTimeout(()=>{
      fade.classList.add('on');
      fadeAudioOut(5);
    }, 0);
  }
  session.addEventListener('touchstart', onTouchStart, {passive:true});
  session.addEventListener('touchend', onTouchEnd, {passive:true});
  session.addEventListener('touchcancel', onTouchEnd, {passive:true});
  session.addEventListener('mousedown', onTouchStart);
  session.addEventListener('mouseup', onTouchEnd);

  document.addEventListener('gesturestart', e=>e.preventDefault());
  document.addEventListener('dblclick', e=>e.preventDefault());

  // initial size
  resize();
})();
</script>
</body>
</html>
