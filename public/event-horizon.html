<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Anti-Anxiety Sleep Pacemaker</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{width:100%;height:100%;background:#000;color:#555;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;
    overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-font-smoothing:antialiased;font-weight:300}
  #stage{position:fixed;inset:0;background:#000}

  /* Landing */
  #landing{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0 32px;transition:opacity 1.4s ease;z-index:10}
  #landing.hidden{opacity:0;pointer-events:none}
  .brand{position:absolute;top:9vh;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.55em;
    text-transform:uppercase;color:#3a3a3a;font-weight:300}
  .brand b{color:#6a6a6a;font-weight:400}
  #enterBtn{position:relative;width:240px;height:240px;border-radius:50%;border:1px solid rgba(120,130,140,.18);
    background:radial-gradient(circle at 50% 50%,
      rgba(45,55,70,.55) 0%,
      rgba(35,45,55,.35) 35%,
      rgba(45,34,25,.18) 65%,
      rgba(0,0,0,0) 80%);
    color:#7a7a7a;font-size:10px;letter-spacing:.5em;font-weight:300;cursor:pointer;outline:none;
    box-shadow:0 0 80px 10px rgba(30,40,50,.35), inset 0 0 60px rgba(40,50,60,.25);
    animation:landPulse 7s ease-in-out infinite;transition:transform .8s ease,opacity 1s ease}
  #enterBtn:active{transform:scale(.97)}
  @keyframes landPulse{
    0%,100%{box-shadow:0 0 80px 10px rgba(30,40,50,.3), inset 0 0 60px rgba(40,50,60,.22);transform:scale(1)}
    50%{box-shadow:0 0 120px 20px rgba(45,55,70,.45), inset 0 0 80px rgba(50,60,72,.32);transform:scale(1.03)}
  }
  .disclaimer{position:absolute;bottom:7vh;left:24px;right:24px;text-align:center;font-size:9.5px;line-height:1.85;
    color:#2e2e2e;letter-spacing:.12em;max-width:340px;margin:0 auto}

  /* Session */
  #session{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity 2.4s ease;z-index:5}
  #session.on{opacity:1;pointer-events:auto}

  .orb-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .orb{
    width:46vmin;height:46vmin;border-radius:50%;
    background:
      radial-gradient(circle at 38% 36%,
        rgba(60,72,90,.85) 0%,
        rgba(44,53,49,.7) 28%,
        rgba(45,34,25,.55) 55%,
        rgba(20,24,28,.25) 75%,
        rgba(0,0,0,0) 100%);
    filter:blur(.5px);
    box-shadow:
      0 0 80px 30px rgba(26,35,50,.35),
      0 0 180px 60px rgba(44,53,49,.22),
      0 0 280px 100px rgba(45,34,25,.12),
      inset 0 0 80px rgba(60,72,90,.25);
    transform:scale(.7);opacity:.55;
    transition:transform 4s cubic-bezier(.45,.05,.55,.95), opacity 4s cubic-bezier(.45,.05,.55,.95),
      filter 4s cubic-bezier(.45,.05,.55,.95);
    will-change:transform,opacity
  }
  .orb.inhale{transform:scale(1.15);opacity:1;filter:blur(0px)}
  .orb.hold-top{transform:scale(1.15);opacity:1;filter:blur(0px);transition-duration:4s}
  .orb.exhale{transform:scale(.7);opacity:.55;filter:blur(.5px)}
  .orb.hold-bot{transform:scale(.7);opacity:.55;filter:blur(.5px);transition-duration:4s}

  .phase{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;
    font-size:11px;letter-spacing:.6em;text-transform:uppercase;color:#555;font-weight:300;
    pointer-events:none;mix-blend-mode:screen;opacity:0;transition:opacity 1.6s ease;
    text-shadow:0 0 24px rgba(0,0,0,.9)}
  .phase.show{opacity:.85}
  .phase .label{display:block;margin-top:30vmin;font-size:10px;color:#4a4a4a}

  .timer{position:absolute;top:max(22px,env(safe-area-inset-top));left:0;right:0;text-align:center;
    font-size:10px;letter-spacing:.45em;color:#3d3d3d;font-variant-numeric:tabular-nums;font-weight:300}

  #stopBtn{position:absolute;bottom:max(36px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    background:transparent;border:1px solid rgba(85,85,85,.18);color:#4a4a4a;
    padding:11px 26px;border-radius:999px;font-size:9.5px;letter-spacing:.45em;text-transform:uppercase;
    cursor:pointer;transition:all .4s ease;font-weight:300}
  #stopBtn:active{background:rgba(255,255,255,.02);color:#666}

  #fadeOut{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;
    transition:opacity 5s ease;z-index:20}
  #fadeOut.on{opacity:1}
</style>
</head>
<body>
<div id="stage">
  <div id="landing">
    <div class="brand">Sleep · <b>Pacemaker</b></div>
    <button id="enterBtn">ENTER THE VOID</button>
    <p class="disclaimer">
      A 5-minute box-breathing session with binaural delta entrainment.
      For relaxation only — not a medical device. Use headphones.
    </p>
  </div>

  <div id="session">
    <div class="timer" id="timer">5:00</div>
    <div class="orb-wrap"><div class="orb" id="orb"></div></div>
    <div class="phase" id="phase"><span class="label" id="phaseLbl">Breathe In</span></div>
    <button id="stopBtn">Stop Session</button>
  </div>

  <div id="fadeOut"></div>
</div>

<script>
(() => {
  const landing = document.getElementById('landing');
  const session = document.getElementById('session');
  const enterBtn = document.getElementById('enterBtn');
  const stopBtn = document.getElementById('stopBtn');
  const orb = document.getElementById('orb');
  const phase = document.getElementById('phase');
  const phaseLbl = document.getElementById('phaseLbl');
  const timerEl = document.getElementById('timer');
  const fade = document.getElementById('fadeOut');

  const SESSION_MS = 5 * 60 * 1000;
  const PHASES = [
    {name:'Breathe In', cls:'inhale',   dur:4000},
    {name:'Hold',       cls:'hold-top', dur:4000},
    {name:'Breathe Out',cls:'exhale',   dur:4000},
    {name:'Hold',       cls:'hold-bot', dur:4000},
  ];
  const CYCLE = 16000;

  let audioCtx, masterGain, oscL, oscR, gL, gR, noiseSrc, noiseGain,
      droneOsc, droneGain, panner, lfo, lfoGain;
  let sessionStart = 0, masterTimer = null, phaseTimer = null, tickTimer = null;
  let liftTimer = null, running = false, ended = false;

  function buildAudio(){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0;
    masterGain.connect(audioCtx.destination);

    // Binaural 100/104 -> 4Hz delta
    const merger = audioCtx.createChannelMerger(2);
    oscL = audioCtx.createOscillator(); oscL.type='sine'; oscL.frequency.value=100;
    oscR = audioCtx.createOscillator(); oscR.type='sine'; oscR.frequency.value=104;
    gL = audioCtx.createGain(); gL.gain.value=0.11;
    gR = audioCtx.createGain(); gR.gain.value=0.11;
    oscL.connect(gL).connect(merger,0,0);
    oscR.connect(gR).connect(merger,0,1);
    merger.connect(masterGain);
    oscL.start(); oscR.start();

    // Brown noise floor
    const sr = audioCtx.sampleRate;
    const buf = audioCtx.createBuffer(1, sr*4, sr);
    const d = buf.getChannelData(0);
    let last = 0;
    for(let i=0;i<d.length;i++){
      const w = Math.random()*2-1;
      last = (last + 0.02*w)/1.02;
      d[i] = last*3.5;
    }
    noiseSrc = audioCtx.createBufferSource();
    noiseSrc.buffer = buf; noiseSrc.loop = true;
    const lp = audioCtx.createBiquadFilter();
    lp.type='lowpass'; lp.frequency.value=320;
    noiseGain = audioCtx.createGain(); noiseGain.gain.value=0.10;
    noiseSrc.connect(lp).connect(noiseGain).connect(masterGain);
    noiseSrc.start();

    // Celestial drone -> stereo panner -> master
    panner = audioCtx.createStereoPanner();
    panner.pan.value = 0;
    droneGain = audioCtx.createGain(); droneGain.gain.value = 0.0;
    const droneFilter = audioCtx.createBiquadFilter();
    droneFilter.type='lowpass'; droneFilter.frequency.value=900;

    // singing bowl: stacked sines
    const freqs = [196, 294, 392.4, 587]; // G3, D4, G4, D5-ish
    freqs.forEach((f,i)=>{
      const o = audioCtx.createOscillator();
      o.type = i===0?'sine':'sine';
      o.frequency.value = f;
      const g = audioCtx.createGain();
      g.gain.value = 0.12 / (i+1);
      o.connect(g).connect(droneFilter);
      o.start();
    });
    droneFilter.connect(droneGain).connect(panner).connect(masterGain);

    // LFO panning matched to 16s breath cycle (period 16s -> freq 1/16 Hz)
    lfo = audioCtx.createOscillator();
    lfo.type='sine';
    lfo.frequency.value = 1/16;
    lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 0.95;
    lfo.connect(lfoGain).connect(panner.pan);
    lfo.start();

    // gentle swell of drone in/out matched to breath
    const swell = audioCtx.createOscillator();
    swell.type='sine'; swell.frequency.value = 1/16;
    const swellGain = audioCtx.createGain(); swellGain.gain.value = 0.09;
    const swellOffset = audioCtx.createConstantSource();
    swellOffset.offset.value = 0.11;
    swell.connect(swellGain).connect(droneGain.gain);
    swellOffset.connect(droneGain.gain);
    swell.start(); swellOffset.start();

    // master fade in
    const now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setValueAtTime(0, now);
    masterGain.gain.linearRampToValueAtTime(0.9, now+5);
  }

  function fadeAudioOut(seconds){
    if(!audioCtx) return;
    const now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setValueAtTime(masterGain.gain.value, now);
    masterGain.gain.linearRampToValueAtTime(0.0001, now+seconds);
  }

  function killAudio(){
    if(!audioCtx) return;
    try{
      fadeAudioOut(0.4);
      setTimeout(()=>{ try{audioCtx.close()}catch(e){} audioCtx=null; }, 600);
    }catch(e){}
  }

  function runPhase(i){
    const p = PHASES[i];
    orb.classList.remove('inhale','hold-top','exhale','hold-bot');
    // force reflow so transition restarts cleanly
    void orb.offsetWidth;
    orb.style.transitionDuration = (p.dur/1000)+'s';
    orb.classList.add(p.cls);
    phaseLbl.textContent = p.name;
    phaseTimer = setTimeout(()=>runPhase((i+1)%PHASES.length), p.dur);
  }

  function fmt(ms){
    const s = Math.max(0, Math.ceil(ms/1000));
    const m = Math.floor(s/60), r = s%60;
    return m+':' + String(r).padStart(2,'0');
  }

  function tick(){
    const left = SESSION_MS - (performance.now()-sessionStart);
    timerEl.textContent = fmt(left);
    if(left<=0){ endSession(); return; }
    tickTimer = setTimeout(tick, 250);
  }

  function startSession(){
    if(running) return;
    running = true;
    landing.classList.add('hidden');
    setTimeout(()=>{ session.classList.add('on'); phase.classList.add('show'); }, 400);
    buildAudio();
    sessionStart = performance.now();
    timerEl.textContent = '5:00';
    runPhase(0);
    tick();
    masterTimer = setTimeout(endSession, SESSION_MS);
  }

  function endSession(){
    if(ended) return;
    ended = true;
    clearTimeout(masterTimer); clearTimeout(phaseTimer); clearTimeout(tickTimer);
    fadeAudioOut(5);
    fade.classList.add('on');
    setTimeout(()=>{
      try{audioCtx&&audioCtx.close()}catch(e){}
      audioCtx=null;
    }, 5200);
  }

  function stopSession(){
    clearTimeout(masterTimer); clearTimeout(phaseTimer); clearTimeout(tickTimer);
    clearTimeout(liftTimer); liftTimer=null;
    killAudio();
    session.classList.remove('on'); phase.classList.remove('show');
    fade.classList.remove('on');
    orb.classList.remove('inhale','hold-top','exhale','hold-bot');
    running = false; ended = false;
    setTimeout(()=>{ landing.classList.remove('hidden'); }, 600);
  }

  enterBtn.addEventListener('click', startSession);
  stopBtn.addEventListener('click', stopSession);

  // Touch-hold safety: lift finger -> 5s fade to black
  function onTouchStart(){
    if(!running||ended) return;
    if(liftTimer){ clearTimeout(liftTimer); liftTimer=null; }
    if(fade.classList.contains('on')){
      // user re-engaged before full collapse — restore audio if still alive
      fade.classList.remove('on');
      if(audioCtx){
        const now = audioCtx.currentTime;
        masterGain.gain.cancelScheduledValues(now);
        masterGain.gain.linearRampToValueAtTime(0.9, now+2);
      }
    }
  }
  function onTouchEnd(){
    if(!running||ended) return;
    if(liftTimer) clearTimeout(liftTimer);
    liftTimer = setTimeout(()=>{
      fade.classList.add('on');
      fadeAudioOut(5);
    }, 0); // begin 5s fade immediately on lift; tween itself is 5s
  }
  // Treat any touch on session as engagement
  session.addEventListener('touchstart', onTouchStart, {passive:true});
  session.addEventListener('touchend', onTouchEnd, {passive:true});
  session.addEventListener('touchcancel', onTouchEnd, {passive:true});
  session.addEventListener('mousedown', onTouchStart);
  session.addEventListener('mouseup', onTouchEnd);

  // Block gestures
  document.addEventListener('gesturestart', e=>e.preventDefault());
  document.addEventListener('dblclick', e=>e.preventDefault());
})();
</script>
</body>
</html>
